<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giriş Yap - KKTC Dayanışma Derneği</title>
  <meta name="robots" content="noindex, follow">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background: #f1f5f9;">

  <div class="container" style="max-width: 450px; margin: 80px auto;">
    <div style="text-align: center; margin-bottom: 25px;">
      <a href="index.html" class="logo-area" style="justify-content: center; margin-bottom: 15px;">
        <div class="logo-symbol"><i class="fa-solid fa-hands-holding-child"></i></div>
      </a>
      <h2 style="color: var(--primary);">Dernek Portalı Girişi</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Yönetici ve Üye Giriş Ekranı</p>
    </div>

    <div class="panel-card">
      <form id="login-form">
        <div class="form-group">
          <label>E-Posta Adresi</label>
          <input type="email" class="form-control" id="login-email" required>
        </div>

        <div class="form-group">
          <label>Şifre</label>
          <input type="password" class="form-control" id="login-pass" required>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; font-size:0.85rem;">
          <a href="#" id="forgot-pass" style="color:var(--secondary);">Şifremi Unuttum</a>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="login-btn" style="padding:12px;">Giriş Yap</button>
      </form>
      <div style="text-align:center; margin-top:20px; font-size:0.9rem;">
        Hesabınız yok mu? <a href="uyelik.html" style="color:var(--secondary); font-weight:600;">Üyelik Başvurusu Yapın</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { supabase, getCurrentUserProfile } from './js/supabase-client.js';
    import { initCookieBanner } from './js/legal.js';

    initCookieBanner();

    const current = await getCurrentUserProfile();
    if (current) {
      if (['admin', 'super_admin'].includes(current.profile.role)) {
        window.location.href = 'admin.html';
      } else {
        window.location.href = 'uye-paneli.html';
      }
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-pass').value;
      const btn = document.getElementById('login-btn');

      btn.disabled = true;
      btn.innerText = 'Kontrol ediliyor...';

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        alert('Giriş başarısız: ' + error.message);
        btn.disabled = false;
        btn.innerText = 'Giriş Yap';
        return;
      }

      const { data: profile } = await supabase.from('profiles').select('role, membership_status').eq('id', data.user.id).single();

      if (profile) {
        if (['admin', 'super_admin'].includes(profile.role)) {
          window.location.href = 'admin.html';
        } else {
          window.location.href = 'uye-paneli.html';
        }
      } else {
        window.location.href = 'index.html';
      }
    });

    document.getElementById('forgot-pass').addEventListener('click', async (e) => {
      e.preventDefault();
      const email = prompt('Şifre sıfırlama linki gönderilecek e-posta adresinizi giriniz:');
      if (email) {
        const { error } = await supabase.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin + '/login.html'
        });
        if (error) alert('Hata: ' + error.message);
        else alert('Şifre sıfırlama bağlantısı e-posta adresinize iletildi.');
      }
    });
  </script>
</body>
</html>
